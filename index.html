<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width,initial-scale=1" />
	<title>Property Listings</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header class="site-header">
		<div class="container header-inner">
			<h1 class="brand">HomeList</h1>
			<nav>
				<div id="auth-area">
					<button id="open-login" class="btn">Login</button>
					<button id="open-add" class="btn btn-primary">Add Property</button>
				</div>
			</nav>
		</div>
	</header>

	<main class="container" role="main">
		<section class="hero">
			<h2>Find your next home — rent or buy</h2>
			<p>Simple, beautiful listings from agents and landlords.</p>
		</section>

		<section class="controls">
			<input id="search" type="search" placeholder="Search by title, address or description" />
			<select id="filter-type">
				<option value="all">All</option>
				<option value="rent">Rent</option>
				<option value="sale">Sale</option>
			</select>
			<select id="filter-bedrooms">
				<option value="any">Any beds</option>
				<option value="1">1+</option>
				<option value="2">2+</option>
				<option value="3">3+</option>
				<option value="4">4+</option>
			</select>
		</section>

		<section id="listings" class="listings"></section>
	</main>

	<!-- Add Property Modal -->
	<div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="modal-heading">
		<div class="modal-panel">
			<button id="close-add" class="close" aria-label="Close dialog">✕</button>
			<h3 id="modal-heading">Add a property</h3>
			<form id="property-form">
				<div class="row">
					<label>Title <input name="title" required /></label>
					<label>Price (USD) <input name="price" type="number" required /></label>
				</div>
				<div class="row">
					<label>Type
						<select name="listingType">
							<option value="rent">Rent</option>
							<option value="sale">Sale</option>
						</select>
					</label>
					<label>Bedrooms <input name="beds" type="number" min="0" value="1" required /></label>
				</div>
				<label>Description <textarea name="description" rows="3"></textarea></label>
				<label>Address <input name="address" /></label>
				<label>Images <input name="images" id="images" type="file" accept="image/*" multiple /></label>
				<div id="preview" class="preview"></div>
				<div class="form-actions">
					<button type="submit" class="btn btn-primary">Save listing</button>
					<button type="button" id="cancel" class="btn">Cancel</button>
				</div>
			</form>
		</div>
	</div>

		<!-- Login Modal -->
		<div id="login-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="login-heading">
			<div class="modal-panel">
				<button id="close-login" class="close" aria-label="Close">✕</button>
				<h3 id="login-heading">Account</h3>
				<form id="login-form">
					<label>Username <input name="username" required /></label>
					<label>Password <input type="password" name="password" required /></label>
					<div class="form-actions">
						<button type="submit" id="login-submit" class="btn btn-primary">Login / Register</button>
						<button type="button" id="login-cancel" class="btn">Cancel</button>
					</div>
				</form>
			</div>
		</div>

			<!-- Manage Listings Modal -->
			<div id="manage-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="manage-heading">
				<div class="modal-panel">
					<button id="close-manage" class="close" aria-label="Close">✕</button>
					<h3 id="manage-heading">Manage Listings</h3>
					<div id="manage-list" style="max-height:60vh;overflow:auto;padding-top:8px"></div>
					<div style="margin-top:12px;text-align:right"><button id="manage-close" class="btn">Close</button></div>
				</div>
			</div>

	<script src="index.js"></script>
</body>
</html>
